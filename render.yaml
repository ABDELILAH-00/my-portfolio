services:
  # Backend API (Laravel via Docker)
  - type: web
    name: portfolio-backend
    env: docker # Use Docker for Laravel
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Abdelilah Amalas Portfolio"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://portfolio-backend.onrender.com"
      - key: FRONTEND_URL
        value: "https://portfolio-frontend.onrender.com"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@example.com"
      - key: ADMIN_MATRICULE
        value: "0000"
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CACHE_STORE
        value: "file"
      - key: SESSION_DRIVER
        value: "file"
      - key: QUEUE_CONNECTION
        value: "sync"

  # Frontend (React/Vite - Static Site)
  - type: web
    name: portfolio-frontend
    env: static # Valid for static sites
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://portfolio-backend.onrender.com/api"
