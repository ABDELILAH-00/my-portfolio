# Netlify Build Configuration
[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to InfinityFree backend
[[redirects]]
  from = "/api/*"
  to = "http://abdelilah-portfolio.wuaze.com/api/:splat"
  status = 200
  force = true

# Proxy storage/image requests to InfinityFree backend
[[redirects]]
  from = "/storage/*"
  to = "http://abdelilah-portfolio.wuaze.com/public/storage/:splat"
  status = 200
  force = true

# SPA fallback - must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
