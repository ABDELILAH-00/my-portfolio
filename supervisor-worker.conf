[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/backend/artisan queue:work --tries=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/your/project/backend/storage/logs/worker.log
stopwaitsecs=3600
